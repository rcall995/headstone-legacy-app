<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#005F60">
    <meta name="description" content="Headstone Legacy - Digital Memorials & Family History. Coming Soon.">
    <title>Headstone Legacy - Coming Soon</title>
    <link rel="icon" type="image/png" href="/logo1.png?v=2">
    <link rel="apple-touch-icon" href="/logo1.png?v=2">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #005F60 0%, #003d3e 50%, #001f20 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .coming-soon-container {
            max-width: 600px;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .banner {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 0.5rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 1.5rem 0;
        }

        .tagline {
            font-size: 1.15rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .contact {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .contact a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: underline;
        }

        .contact a:hover {
            color: #fff;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            .banner {
                font-size: 0.95rem;
                padding: 0.4rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="coming-soon-container">
        <div class="logo">
            <img src="/logo1.png" alt="Headstone Legacy">
        </div>
        <h1>Headstone Legacy</h1>
        <div class="banner">Coming Soon</div>
        <p class="tagline">
            We're building something meaningful. Beautiful digital memorials
            to preserve family legacies for generations to come.
        </p>
        <p class="contact">
            Questions? Reach us at
            <a href="mailto:support@headstonelegacy.com">support@headstonelegacy.com</a>
        </p>
    </div>
</body>
</html>
